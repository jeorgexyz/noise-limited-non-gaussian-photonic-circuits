name: tests

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # The reference backend must work without the Piquasso extra, so both
        # configurations are exercised. Piquasso tests skip themselves when absent.
        extras: ["", "sim"]
    name: python 3.12 ${{ matrix.extras && format('[{0}]', matrix.extras) || '[core]' }}

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install
        run: |
          python -m pip install --upgrade pip
          if [ -n "${{ matrix.extras }}" ]; then
            pip install -e ".[${{ matrix.extras }},dev]"
          else
            pip install -e ".[dev]"
          fi

      - name: Lint
        run: ruff check src/ tests/ experiments/

      - name: Test
        run: pytest tests/ -q --junitxml=results.xml

      - name: Validation experiment
        # The headline closed-form check runs in CI, so a regression in the
        # physics is caught rather than only a regression in the tests.
        run: python experiments/00_validation/run_validation.py

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-results-${{ matrix.extras || 'core' }}
          path: results.xml
          if-no-files-found: ignore
