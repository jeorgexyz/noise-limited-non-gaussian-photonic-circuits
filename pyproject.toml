[project]
name = "ngphotonic"
version = "0.2.0"
description = "Noise-induced collapse surfaces for operational non-Gaussianity in finite-depth photonic circuits"
readme = "README.md"
requires-python = ">=3.12"
license = { file = "LICENSE" }
authors = [{ name = "Jeorge D. Anderson II" }]
keywords = [
    "quantum-optics",
    "continuous-variable",
    "non-gaussianity",
    "wigner-negativity",
    "photonic-quantum-computing",
]

# The reference simulator and reproducible experiments use this core stack.
# NumPy 2 supplies trapezoid(), used by the Wigner and homodyne integrals.
dependencies = [
    "numpy>=2.0",
    "scipy>=1.11",
    "matplotlib>=3.8",
]

[project.optional-dependencies]
sim = [
    "piquasso[jax]>=8.0",  # conventions pinned against 8.0.1; see backends/piquasso.py
    "jax>=0.4",
]
data = [
    "pandas>=2.1",
    "xarray>=2024.1",
    "zarr>=2.16",
    "pydantic>=2.5",
    "tqdm>=4.66",
]
dev = [
    "pytest>=8.0",
    "pytest-cov>=4.1",
    # Pinned exactly: ruff's default rule set widens between releases, so an
    # unpinned linter turns CI red with no change to the code. Bump deliberately.
    "ruff==0.16.8",
    "mypy>=1.8",
]

[project.urls]
Repository = "https://github.com/jeorgexyz/noise-limited-non-gaussian-photonic-circuits"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/ngphotonic"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
# Selected explicitly rather than inherited, so the gate is a property of this
# repository and not of whichever ruff version happens to be installed. Kept to
# correctness and consistency rules; the more opinionated families (PL, TRY, C4)
# are left out deliberately rather than suppressed case by case.
select = ["E", "F", "I", "UP", "B", "RUF"]

[tool.ruff.lint.per-file-ignores]
# Experiment scripts insert the source tree on sys.path before importing the
# package, so module-level imports cannot come first. This is structural, not an
# oversight, and annotating every line would be noise.
"experiments/**" = ["E402"]

[tool.mypy]
python_version = "3.12"
warn_unused_ignores = true
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["tests"]
# Lets the suite run straight from a checkout without an editable install.
pythonpath = ["src"]
markers = ["slow: validation runs that sweep grids or cutoffs"]
