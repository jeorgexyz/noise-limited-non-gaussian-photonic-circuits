[project]
name = "ngphotonic"
version = "0.1.0"
description = "Noise-induced collapse surfaces for operational non-Gaussianity in finite-depth photonic circuits"
readme = "README.md"
requires-python = ">=3.12"
license = { file = "LICENSE" }
authors = [{ name = "J. D. Anderson" }]
keywords = [
    "quantum-optics",
    "continuous-variable",
    "non-gaussianity",
    "wigner-negativity",
    "photonic-quantum-computing",
]

# V1 prototype only needs the plotting/analysis stack. The Piquasso-backed
# simulation lands in V2; see RESEARCH_PLAN.md.
dependencies = [
    "numpy>=1.26",
    "scipy>=1.11",
    "matplotlib>=3.8",
]

[project.optional-dependencies]
sim = [
    "piquasso[jax]>=8.0",  # conventions pinned against 8.0.1; see backends/piquasso.py
    "jax>=0.4",
]
data = [
    "pandas>=2.1",
    "xarray>=2024.1",
    "zarr>=2.16",
    "pydantic>=2.5",
    "tqdm>=4.66",
]
dev = [
    "pytest>=8.0",
    "pytest-cov>=4.1",
    "ruff>=0.3",
    "mypy>=1.8",
]

[project.urls]
Repository = "https://github.com/jeorgexyz/noise-limited-non-gaussian-photonic-circuits"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/ngphotonic"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.mypy]
python_version = "3.12"
warn_unused_ignores = true
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["tests"]
# Lets the suite run straight from a checkout without an editable install.
pythonpath = ["src"]
markers = ["slow: validation runs that sweep grids or cutoffs"]
